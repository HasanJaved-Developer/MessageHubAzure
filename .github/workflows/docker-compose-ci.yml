name: docker-compose-ci

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v1.2.3
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-compose-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_SLUG: message-hub-azure
  PLATFORMS: linux/amd64,linux/arm64
  DOCKERHUB_NAMESPACE: "hasanjaveddeveloper"        # optional mirroring
  PUSH_IMAGES: "true"                                # always push in GitHub CI
  ALLOW_LOCAL_PUSH: "true"                           # allows push when not running under act

jobs:
  images:
    name: Build and Push Images (GHCR)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/master') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      # ---------- Source checkout ----------
      - name: Checkout (act)
        if: ${{ env.ACT }}
        run: echo "Repo mounted by act. Skipping actions/checkout."

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Detect Changed Components
        id: changes
        shell: bash
        run: |
            set -euo pipefail

            CURRENT_TAG="${GITHUB_REF_NAME}"

            PREVIOUS_TAG=$(
              git tag --merged HEAD \
                --list 'v*.*.*' \
                --sort=-version:refname |
              grep -Fxv "$CURRENT_TAG" |
              head -n 1 || true
            )

            if [ -z "$PREVIOUS_TAG" ]; then
              echo "No previous release found. Building all components."
              CHANGED_FILES=""
              BUILD_USERAPI=true
              BUILD_API=true
              BUILD_WEB=true
              BUILD_FUNCTION=true
            else
              echo "Comparing $PREVIOUS_TAG → $CURRENT_TAG"

              CHANGED_FILES=$(git diff --name-only "$PREVIOUS_TAG" "$CURRENT_TAG")

              BUILD_USERAPI=false
              BUILD_API=false
              BUILD_WEB=false
              BUILD_FUNCTION=false

              if echo "$CHANGED_FILES" | grep -q '^UserManagementApi/'; then
                BUILD_USERAPI=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^CentralizedLoggingApi/'; then
                BUILD_API=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^ApiIntegrationMvc/'; then
                BUILD_WEB=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^AzureFunctions.Invalidator/'; then
                BUILD_FUNCTION=true
              fi

              if echo "$CHANGED_FILES" | grep -q '^SharedLibrary/'; then
                BUILD_USERAPI=true
                BUILD_API=true
                BUILD_WEB=true
                BUILD_FUNCTION=true
              fi
            fi

            echo "userapi=$BUILD_USERAPI" >> "$GITHUB_OUTPUT"
            echo "api=$BUILD_API" >> "$GITHUB_OUTPUT"
            echo "web=$BUILD_WEB" >> "$GITHUB_OUTPUT"
            echo "function=$BUILD_FUNCTION" >> "$GITHUB_OUTPUT"

            echo "User API: $BUILD_USERAPI"
            echo "Logging API: $BUILD_API"
            echo "Web: $BUILD_WEB"
            echo "Azure Function: $BUILD_FUNCTION"

      - name: Select Docker Bake Targets
        id: targets
        shell: bash
        run: |
          TARGETS=""

          if [ "${{ steps.changes.outputs.userapi }}" = "true" ]; then
            TARGETS="$TARGETS userapi"
          fi

          if [ "${{ steps.changes.outputs.api }}" = "true" ]; then
            TARGETS="$TARGETS api"
          fi

          if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            TARGETS="$TARGETS web"
          fi
          
          if [ "${{ steps.changes.outputs.function }}" = "true" ]; then
            TARGETS="$TARGETS function-invalidator"
          fi

          TARGETS="${TARGETS# }"

          echo "Selected Docker Bake targets: $TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      # ---------- Tooling ----------
      - name: Set up QEMU
        if: ${{ !env.ACT }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v3

      - name: Bootstrap buildx (act)
        if: ${{ env.ACT }}
        run: |
          docker buildx create --use --driver docker --name actdocker || true
          docker buildx inspect --bootstrap

      - name: Force single-arch for act and non-tag builds
        run: |
          if [ -n "${ACT:-}" ]; then echo "PLATFORMS=linux/amd64" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then echo "PLATFORMS=linux/amd64" >> $GITHUB_ENV; fi
        shell: bash

      - name: Compute tag override lines
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_SLUG="${REPO_SLUG}"
          REF="${GITHUB_REF}"
          HUB_NS="${DOCKERHUB_NAMESPACE:-}"

          add_lines() { # svc, tags...
            local svc="$1"; shift
            local -a tags=( "$@" )
            for t in "${tags[@]}"; do printf '%s.tags=%s\n' "$svc" "$t"; done
          }

          # GHCR base tags
          is_master=false
          is_tag=false

          if [[ "$REF" == "refs/heads/master" ]]; then
             is_master=true
          elif [[ "$REF" == refs/tags/v* ]]; then
             is_tag=true
          fi

          # Non-master, non-tag branches -> edge
          if ! $is_master && ! $is_tag; then
            user_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/userapi:edge" )
            api_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/api:edge" )
            web_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/web:edge" )
            invalidator_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/function-invalidator:edge" )
          fi

          # Master branch -> latest
          if $is_master; then
            user_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/userapi:latest" )
            api_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/api:latest" )
            web_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/web:latest" )
            invalidator_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/function-invalidator:latest" ) 
          fi

          # Release tags -> vX.Y.Z and X.Y (optionally also latest if you want)
          if $is_tag; then
            ver="${REF#refs/tags/}"     # vX.Y.Z
            short="${ver#v}"            # X.Y.Z
            minor="${short%.*}"         # X.Y
            
            user_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/userapi:${ver}" )
            api_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/api:${ver}" )
            web_tags+=(  "ghcr.io/${OWNER_LC}/${REPO_SLUG}/web:${ver}" )
            invalidator_tags+=( "ghcr.io/${OWNER_LC}/${REPO_SLUG}/function-invalidator:${ver}" ) 
            
          fi

          # Docker Hub mirrors (optional, only if namespace present)
          if [[ -n "$HUB_NS" ]]; then
            hub_user=( "${user_tags[@]/#ghcr.io\/${OWNER_LC}\/${REPO_SLUG}\/userapi:/docker.io/${HUB_NS}/${REPO_SLUG}-userapi:}" )
            hub_api=(  "${api_tags[@]/#ghcr.io\/${OWNER_LC}\/${REPO_SLUG}\/api:/docker.io/${HUB_NS}/${REPO_SLUG}-api:}" )
            hub_web=(  "${web_tags[@]/#ghcr.io\/${OWNER_LC}\/${REPO_SLUG}\/web:/docker.io/${HUB_NS}/${REPO_SLUG}-web:}" )
            hub_invalidator=( "${invalidator_tags[@]/#ghcr.io\/${OWNER_LC}\/${REPO_SLUG}\/function-invalidator:/docker.io/${HUB_NS}/${REPO_SLUG}-function-invalidator:}" )
            user_tags+=( "${hub_user[@]}" )
            api_tags+=(  "${hub_api[@]}" )
            web_tags+=(  "${hub_web[@]}" )
            invalidator_tags+=( "${hub_invalidator[@]}" )
          fi

          {
            echo "user_set<<EOF"; add_lines userapi "${user_tags[@]}"; echo "EOF"
            echo "api_set<<EOF";  add_lines api     "${api_tags[@]}";  echo "EOF"
            echo "web_set<<EOF";  add_lines web     "${web_tags[@]}";  echo "EOF"
            echo "invalidator_set<<EOF"; add_lines function-invalidator  "${invalidator_tags[@]}"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ---------- GHCR login ----------
      - name: Login to GHCR (act)
        if: ${{ env.ACT }}
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ACT: login to Docker Hub via CLI
      - name: Login to Docker Hub (act)        
        shell: bash
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # GitHub CI: login action
      - name: Login to Docker Hub        
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- ACT: CLI bake (avoids dial-stdio) ----------
      - name: Bake (ACT)
        if: ${{ env.ACT }}
        shell: bash
        env:
          DO_PUSH: ${{ env.PUSH_IMAGES == 'true' && env.ALLOW_LOCAL_PUSH == 'true' && 'true' || 'false' }}
          SELECTED_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          
          if [ -z "$SELECTED_TARGETS" ]; then
              echo "No Docker components changed. Skipping build."
              exit 0
          fi

          read -r -a TARGETS <<< "$SELECTED_TARGETS"

          echo "Selected targets: ${TARGETS[*]}"
          
          COMMON_SET=(
            "--set" "*.platform=${PLATFORMS}"
            "--set" "*.labels.org.opencontainers.image.revision=${GITHUB_SHA}"
          )
          while IFS= read -r l; do COMMON_SET+=( "--set" "$l" ); done <<< "${{ steps.tags.outputs.user_set }}"
          while IFS= read -r l; do COMMON_SET+=( "--set" "$l" ); done <<< "${{ steps.tags.outputs.api_set }}"
          while IFS= read -r l; do COMMON_SET+=( "--set" "$l" ); done <<< "${{ steps.tags.outputs.web_set }}"
          while IFS= read -r l; do COMMON_SET+=( "--set" "$l" ); done <<< "${{ steps.tags.outputs.invalidator_set }}"



          if [ ${#TARGETS[@]} -eq 0 ]; then
             echo "No Docker components changed. Skipping build."

          elif [ "$DO_PUSH" = "true" ]; then
            docker buildx bake -f ./docker-bake.hcl \
              "${COMMON_SET[@]}" \
              "${TARGETS[@]}" \
              --push

          else
            docker buildx bake -f ./docker-bake.hcl \
              "${COMMON_SET[@]}" \
              --set "*.platform=linux/amd64" \
              "${TARGETS[@]}" \
              --load
          fi

      # ---------- GitHub CI: bake action ----------
      - name: Bake and Push (GitHub)
        if: ${{ !env.ACT }}
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          push: ${{ env.PUSH_IMAGES == 'true' }}
          set: |
            *.platform=${{ env.PLATFORMS }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            ${{ steps.tags.outputs.user_set }}
            ${{ steps.tags.outputs.api_set }}
            ${{ steps.tags.outputs.web_set }}
            ${{ steps.tags.outputs.invalidator_set }}
